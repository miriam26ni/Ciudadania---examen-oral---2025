questions.sort(() => Math.random() - 0.5);

let index = 0;

function displayQuestion(){
document.getElementById("question").innerText=(index+1)+". "+questions[index].q;
document.getElementById("feedback").innerHTML="";
document.getElementById("error").innerText="";
document.getElementById("next-btn").style.display="none";
}

function speakQuestion(){
const u=new SpeechSynthesisUtterance(questions[index].q);
u.lang="en-US";u.rate=0.95;speechSynthesis.speak(u);
}

function startListening(){
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SpeechRecognition){document.getElementById("error").innerText="Use Chrome or Edge.";return;}
const recognition=new SpeechRecognition();
recognition.lang="en-US";recognition.start();
recognition.onresult=e=>{checkAnswer(e.results[0][0].transcript.toLowerCase());};
}

function checkAnswer(ans){
ans = ans.toLowerCase().trim();

const ok = questions[index].a.some(a =>
ans.includes(a.toLowerCase().trim())
);

document.getElementById("feedback").innerHTML=
ok?`<span id="correct">Correct!</span><br>You said: "${ans}"`
:`<span id="incorrect">Incorrect.</span><br>You said: "${ans}"<br>Correct answers: ${questions[index].a.join(", ")}`;

document.getElementById("next-btn").style.display="inline-block";
}

function nextQuestion(){
index++;
if(index<questions.length){displayQuestion();speakQuestion();}
else{
document.getElementById("question").innerText="🎉 Congratulations Miriam! You finished all 128 questions!";
document.getElementById("feedback").innerText="You are ready for your USCIS interview 🇺🇸";
document.querySelectorAll("button").forEach(b=>b.style.display="none");
}}

displayQuestion();
speakQuestion();
