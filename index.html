<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>128 Civics Questions Oral Test Simulator - Random Order</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
    background-color: #f8f9fa;
    line-height: 1.5;
}
#quiz-container {
    max-width: 720px;
    margin: auto;
    padding: 25px;
    background: white;
    border-radius: 10px;
    box-shadow: 0 0 20px rgba(0,0,0,0.1);
}
h1 { color: #007bff; text-align: center; }
p { text-align: center; color: #555; }
#question {
    font-size: 20px;
    font-weight: bold;
    margin: 30px 0 20px;
    min-height: 60px;
}
button {
    padding: 12px 28px;
    margin: 8px 6px;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
}
button:hover { background: #0056b3; }
#next-btn { background: #28a745; display:none; }
#next-btn:hover { background: #218838; }
#feedback {
    margin: 25px 0;
    font-size: 18px;
    min-height: 80px;
}
#correct { color: #28a745; font-weight: bold; }
#incorrect { color: #dc3545; font-weight: bold; }
#error { color: #dc3545; font-style: italic; }
</style>
</head>

<body>
<div id="quiz-container">
<h1>128 Civics Questions – Oral Test Simulator</h1>
<p>Hello Miriam! Practice like the real USCIS oral exam 🇺🇸</p>

<div id="question"></div>

<button onclick="speakQuestion()">🔊 Listen to Question</button>
<button onclick="startListening()">🎤 Answer by Speaking</button>

<div id="feedback"></div>
<div id="error"></div>

<button onclick="nextQuestion()" id="next-btn">Next Question →</button>
</div>

<script>
const questions = [
{q:"What is the form of government of the United States?",a:["republic","constitution-based federal republic","representative democracy"]},
{q:"What is the supreme law of the land?",a:["u.s. constitution"]},
{q:"Name one thing the U.S. Constitution does.",a:["forms the government","defines powers of government","Defines the parts of government","protects the rights of the people"]},
{q:" The U.S. Constitution starts with the words “We the People.” What does “We the People” mean?",a:["self-government","Popular sovereignty","Consent of the governed","People should govern themselves,"(Example of) social contract"]},
{q:"How are changes made to the U.S. Constitution?",a:["amendments","The amendment process"]},
{q:"What does the Bill of Rights protect?",a:["(The basic) rights of Americans","(The basic) rights of people living in the United States"]},
{q:"How many amendments does the Constitution have?",a:["27","twenty-seven"]},
{q:"Why is the Declaration of Independence important?",a:["It says America is free from British control."," It says all people are created equal.","  It identifies inherent rights"," It identifies individual freedoms."]},
{q:"What founding document said the colonies were free from Britain?",a:["declaration of independence"]},
{q:" What are important ideas from the Declaration of Independence and the U.S. Constitution.",a:[" Equality","Liberty","Social contract","Natural rights","Limited government","Self-government"]},
{q:"The words “Life, Liberty, and the pursuit of Happiness” are in what founding document?",a:["Declaration of Independence"]},
{q:"What is the economic system of the United States?",a:["capitalism","free market economy"]},
{q:"What is the rule of law?",a:["everyone must follow the law"," Leaders must obey the law.","Government must obey the law.","no one is above the law"]},
{q:"what documents influenced the U.S. Constitution.",a:["Declaration of Independence"," Articles of Confederation","Federalist Papers","Anti-Federalist Papers","Virginia Declaration of Rights","Fundamental Orders of Connecticut","Mayflower Compact","Iroquois Great Law of Peace"]},
{q:"There are three branches of government. Why?.",a:["So one part does not become too powerful","Checks and balances","Separation of powers"]},
{q:"Name the three branches of government.",a:["Legislative, executive, and judicial","Congress, president, and the courts"]},
{q:" What part of the federal government writes laws?",a:["(U.S.) Congress"," (U.S. or national) legislature","Legislative branch"]},
{q:"What are the two parts of the U.S. Congress?",a:["Senate and House (of Representatives)"]},
{q:"Name three power of the U.S. Congress.",a:["Writes laws","Declares war","Makes the federal budget"]},
{q:"How many U.S. senators are there?",a:["One hundred"]},
{q:"How long is a term for a U.S. senator?",a:["Six years"]},
{q:"Who is one of your state’s U.S. senators now?",a:[" Answers will vary. [District of Columbia residents and residents of U.S. territories should answer that D.C. (or the territory where the applicant lives) has no U.S. senators."]},
{q:"How many voting members are in the House of Representatives?",a:["Four hundred thirty-five"]},
{q:"How long is a term for a member of the House of Representatives?",a:["Two years"]},
{q:"Why do U.S. representatives serve shorter terms than U.S. senators?",a:["To more closely follow public opinion"]},
{q:"How many senators does each state have?",a:["Two"]},
{q:"Why does each state have two senators?",a:["Equal representation (for small states)","The Great Compromise (Connecticut Compromise)"]},
{q:"Name your U.S. representative.",a:["Answers will vary.","Residents of territories with nonvoting Delegates or Resident Commissioners may provide the name of that Delegate or Commissioner."," It is also acceptable to say that the territory has no voting representatives in Congress."]},
{q:"What is the name of the Speaker of the House of Representatives now?",a:["Mike Johnson"]},
{q:"Who does a U.S. senator represent?",a:["Citizens of their state","People of their state"]},
{q:"Who elects U.S. senators?",a:["Citizens from their state"]},
{q:"Who does a member of the House of Representatives represent?",a:["Citizens in their congressional district"," Citizens in their district","People from their congressional district","People in their district"]},
{q:"Who elects members of the House of Representatives?",a:["Citizens from their (congressional) district"]},
{q:"Some states have more representatives than other states. Why?",a:["Because of the state’s population","Because they have more people","Because some states have more people"]},
{q:"The President of the United States is elected for how many years?",a:["Four years"]},
{q:"The President of the United States can serve only two terms. Why? ",a:["Because of the 22nd Amendment"," To keep the president from becoming too powerful"]},
{q:"What is the name of the President of the United States now?",a:["Donald Trump."]},
{q:"What is the name of the Vice President of the United States now?",a:["James David Vance"]},
{q:"If the president can no longer serve, who becomes president?",a:["The Vice President (of the United States)"]},
{q:"Name six power of the president.",a:["Signs bills into law","Vetoes bills","Enforces laws","Commander in Chief (of the military)","Appoints federal judges"]},
{q:"Who is Commander in Chief of the U.S. military?",a:["The President (of the United States)"]},
{q:"Who signs bills to become laws?",a:["The President (of the United States)"]},
{q:"Who vetoes bills?",a:["The President (of the United States)"]},
{q:"Who appoints federal judges?",a:["The President (of the United States)"]},
{q:"The executive branch has many parts. Name three.",a:["President (of the United States)","Cabinet","Federal departments and agencies"]},
{q:"What does the President’s Cabinet do?",a:["Advises the President (of the United States)"]},
{q:"Who is the governor of your state?",a:["ned lamont"]},
{q:"What is the capital of Connecticut?",a:["hartford"]},
{q:"What is the name of the President of the United States now?",a:["donald trump","donald j. trump"]},
{q:"What is the name of the Vice President now?",a:["jd vance","james david vance"]},
{q:"Who is the Chief Justice of the United States?",a:["john roberts"]},
{q:"How many justices are on the Supreme Court?",a:["9","nine"]},
{q:"What is the capital of the United States?",a:["washington dc","washington d.c."]},
{q:"Why does the flag have 13 stripes?",a:["13 original colonies"]},
{q:"Why does the flag have 50 stars?",a:["one for each state"]},
{q:"What is the name of the national anthem?",a:["the star-spangled banner"]},
{q:"When is Independence Day?",a:["july 4"]},
{q:"What is Memorial Day?",a:["honors soldiers who died"]},
{q:"What is Veterans Day?",a:["honors all who served"]}
];

// 🔀 MEZCLAR PREGUNTAS
questions.sort(() => Math.random() - 0.5);

let currentQuestionIndex = 0;

function displayQuestion() {
    document.getElementById("question").innerText =
    (currentQuestionIndex + 1) + ". " + questions[currentQuestionIndex].q;
    document.getElementById("feedback").innerText = "";
    document.getElementById("error").innerText = "";
    document.getElementById("next-btn").style.display = "none";
}

function speakQuestion() {
    const u = new SpeechSynthesisUtterance(questions[currentQuestionIndex].q);
    u.lang = "en-US";
    u.rate = 0.95;
    speechSynthesis.speak(u);
}

function startListening() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        document.getElementById("error").innerText = "Use Chrome or Edge.";
        return;
    }
    const recognition = new SpeechRecognition();
    recognition.lang = "en-US";
    recognition.start();

    recognition.onresult = e => {
        const spoken = e.results[0][0].transcript.toLowerCase();
        checkAnswer(spoken);
    };
}

function checkAnswer(userAnswer) {
    const correct = questions[currentQuestionIndex].a.map(a => a.toLowerCase());
    const ok = correct.some(a => userAnswer.includes(a) || a.includes(userAnswer));

    document.getElementById("feedback").innerHTML =
    ok
    ? `<span id="correct">Correct!</span><br>You said: "${userAnswer}"`
    : `<span id="incorrect">Incorrect.</span><br>You said: "${userAnswer}"<br>Correct answers: ${questions[currentQuestionIndex].a.join(", ")}`;

    document.getElementById("next-btn").style.display = "inline-block";
}

function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex < questions.length) {
        displayQuestion();
        speakQuestion();
    } else {
        document.getElementById("question").innerText =
        "🎉 Congratulations Miriam! You finished the practice.";
        document.getElementById("feedback").innerText =
        "You are ready for your USCIS interview 🇺🇸";
        document.querySelectorAll("button").forEach(b => b.style.display="none");
    }
}

// INICIAR
displayQuestion();
speakQuestion();
</script>
</body>
</html>
