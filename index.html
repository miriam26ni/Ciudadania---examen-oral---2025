<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>128 Civics Questions Oral Test Simulator</title>

<style>
body {font-family: Arial, sans-serif;margin:20px;background:#f8f9fa;line-height:1.5;}
#quiz-container {max-width:720px;margin:auto;padding:25px;background:white;border-radius:10px;box-shadow:0 0 20px rgba(0,0,0,0.1);}
h1 {color:#007bff;text-align:center;}
p {text-align:center;color:#555;}
#question {font-size:20px;font-weight:bold;margin:30px 0 20px;min-height:60px;}
button {padding:12px 28px;margin:8px 6px;background:#007bff;color:white;border:none;border-radius:6px;cursor:pointer;font-size:16px;}
button:hover {background:#0056b3;}
#next-btn {background:#28a745;display:none;}
#next-btn:hover {background:#218838;}
#feedback {margin:25px 0;font-size:18px;min-height:80px;}
#correct {color:#28a745;font-weight:bold;}
#incorrect {color:#dc3545;font-weight:bold;}
#error {color:#dc3545;font-style:italic;}
</style>
</head>

<body>
<div id="quiz-container">
<h1>128 Civics Questions – Oral Test Simulator</h1>
<p>Hello Miriam! Practice like the real USCIS oral exam 🇺🇸</p>

<div id="question"></div>

<button onclick="speakQuestion()">🔊 Listen to Question</button>
<button onclick="startListening()">🎤 Answer by Speaking</button>

<div id="feedback"></div>
<div id="error"></div>

<button onclick="nextQuestion()" id="next-btn">Next Question →</button>
</div>

<script>
const questions = [
{q:"What is the form of government of the United States?",a:["republic","constitution-based federal republic","representative democracy"]},
{q:"What is the supreme law of the land?",a:["constitution","u.s. constitution"]},
{q:"What does the United States Constitution do?",a:["forms the government","defines powers of government","defines the parts of government","protects the rights of the people"]},
{q:"What does “We the People” mean?",a:["self-government","popular sovereignty","consent of the governed","social contract"]},
{q:"How are changes made to the U.S. Constitution?",a:["amendments","amendment process"]},
{q:"What does the Bill of Rights protect?",a:["basic rights","rights of americans","rights of people living in the united states"]},
{q:"How many amendments does the U.S. Constitution have?",a:["27","twenty seven"]},
{q:"Why is the Declaration of Independence important?",a:["america is free from british control","all people are created equal","identifies inherent rights","identifies individual freedoms"]},
{q:"What founding document said the colonies were free from Britain?",a:["declaration of independence"]},
{q:"Name one important idea from the Declaration of Independence.",a:["equality","liberty","natural rights","limited government","self-government","social contract"]},
{q:"The words 'Life, Liberty, and the pursuit of Happiness' are in what document?",a:["declaration of independence"]},
{q:"What is the economic system of the United States?",a:["capitalism","free market economy"]},
{q:"What is the rule of law?",a:["everyone must follow the law","leaders must obey the law","government must obey the law","no one is above the law"]},
{q:"Name one document that influenced the U.S. Constitution.",a:["declaration of independence","articles of confederation","federalist papers","virginia declaration of rights","mayflower compact"]},
{q:"Why are there three branches of government?",a:["checks and balances","separation of powers","so one part does not become too powerful"]},
{q:"Name the three branches of government.",a:["legislative executive and judicial","congress president and the courts"]},
{q:"The President is in charge of which branch?",a:["executive branch"]},
{q:"What part of the government writes laws?",a:["congress","legislative branch"]},
{q:"What are the two parts of Congress?",a:["senate and house"]},
{q:"Name one power of Congress.",a:["writes laws","declares war","makes the federal budget"]},
{q:"How many U.S. senators are there?",a:["100","one hundred"]},
{q:"How long is a term for a U.S. senator?",a:["six years"]},
{q:"How many voting members are in the House?",a:["435","four hundred thirty five"]},
{q:"How long is a term for a House member?",a:["two years"]},
{q:"Why do representatives serve shorter terms?",a:["follow public opinion"]},
{q:"How many senators does each state have?",a:["two"]},
{q:"Why does each state have two senators?",a:["equal representation","great compromise"]},
{q:"Who does a U.S. senator represent?",a:["people of their state","citizens of their state"]},
{q:"Who elects U.S. senators?",a:["citizens of their state"]},
{q:"Who does a House member represent?",a:["people in their district","citizens in their district"]},
{q:"Who elects members of the House?",a:["citizens in their district"]},
{q:"Why do some states have more representatives?",a:["because of population"]},
{q:"How long is a presidential term?",a:["four years"]},
{q:"Why can a president only serve two terms?",a:["22nd amendment","not become too powerful"]},
{q:"If the president cannot serve, who becomes president?",a:["vice president"]},
{q:"Name one power of the president.",a:["signs bills","vetoes bills","enforces laws","commander in chief","appoints judges","chief diplomat"]},
{q:"Who is Commander in Chief?",a:["the president"]},
{q:"Who signs bills into law?",a:["the president"]},
{q:"Who vetoes bills?",a:["the president"]},
{q:"Who appoints federal judges?",a:["the president"]},
{q:"What does the Cabinet do?",a:["advises the president"]},
{q:"What is one part of the judicial branch?",a:["supreme court","federal courts"]},
{q:"What does the judicial branch do?",a:["reviews laws","explains laws","resolves disputes","decides if a law is unconstitutional"]},
{q:"What is the highest court?",a:["supreme court"]},
{q:"How many Supreme Court justices are there?",a:["9","nine"]},
{q:"How long do justices serve?",a:["for life","life term"]},
{q:"Who is Chief Justice now?",a:["john roberts"]},
{q:"What is the capital of the United States?",a:["washington dc","washington d.c."]},
{q:"Where is the Statue of Liberty?",a:["new york harbor","liberty island","new jersey"]},
{q:"Why does the flag have 13 stripes?",a:["13 original colonies"]},
{q:"Why does the flag have 50 stars?",a:["50 states"]},
{q:"What is the national anthem?",a:["star spangled banner"]},
{q:"What is Independence Day?",a:["july 4","fourth of july"]},
{q:"Name one national holiday.",a:["christmas","thanksgiving","independence day","memorial day","labor day"]}
];

// Mezclar
questions.sort(() => Math.random() - 0.5);

let index = 0;

function displayQuestion(){
document.getElementById("question").innerText=(index+1)+". "+questions[index].q;
document.getElementById("feedback").innerHTML="";
document.getElementById("error").innerText="";
document.getElementById("next-btn").style.display="none";
}

function speakQuestion(){
const u=new SpeechSynthesisUtterance(questions[index].q);
u.lang="en-US";u.rate=0.95;speechSynthesis.speak(u);
}

function startListening(){
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SpeechRecognition){document.getElementById("error").innerText="Use Chrome or Edge.";return;}
const recognition=new SpeechRecognition();
recognition.lang="en-US";recognition.start();
recognition.onresult=e=>{checkAnswer(e.results[0][0].transcript.toLowerCase());};
}

function checkAnswer(ans){
const ok=questions[index].a.some(a=>ans.includes(a));
document.getElementById("feedback").innerHTML=
ok?`<span id="correct">Correct!</span><br>You said: "${ans}"`
:`<span id="incorrect">Incorrect.</span><br>You said: "${ans}"<br>Correct answers: ${questions[index].a.join(", ")}`;
document.getElementById("next-btn").style.display="inline-block";
}

function nextQuestion(){
index++;
if(index<questions.length){displayQuestion();speakQuestion();}
else{
document.getElementById("question").innerText="🎉 Congratulations Miriam! You finished all 128 questions!";
document.getElementById("feedback").innerText="You are ready for your USCIS interview 🇺🇸";
document.querySelectorAll("button").forEach(b=>b.style.display="none");
}
}

displayQuestion();
speakQuestion();
</script>
</body>
</html>
