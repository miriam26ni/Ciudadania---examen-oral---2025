<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>128 Civics Questions Oral Test Simulator</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
    background-color: #f8f9fa;
    line-height: 1.5;
}
#quiz-container {
    max-width: 720px;
    margin: auto;
    padding: 25px;
    background: white;
    border-radius: 10px;
    box-shadow: 0 0 20px rgba(0,0,0,0.1);
}
h1 { color: #007bff; text-align: center; }
p { text-align: center; color: #555; }
#question {
    font-size: 20px;
    font-weight: bold;
    margin: 30px 0 20px;
    min-height: 60px;
}
button {
    padding: 12px 28px;
    margin: 8px 6px;
    background: #007bff;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
}
button:hover { background: #0056b3; }
#next-btn { background: #28a745; display:none; }
#next-btn:hover { background: #218838; }
#feedback {
    margin: 25px 0;
    font-size: 18px;
    min-height: 80px;
}
#correct { color: #28a745; font-weight: bold; }
#incorrect { color: #dc3545; font-weight: bold; }
#error { color: #dc3545; font-style: italic; }
</style>
</head>

<body>
<div id="quiz-container">
<h1>128 Civics Questions – Oral Test Simulator</h1>
<p>Hello Miriam! Practice like the real USCIS oral exam 🇺🇸</p>

<div id="question"></div>

<button onclick="speakQuestion()">🔊 Listen to Question</button>
<button onclick="startListening()">🎤 Answer by Speaking</button>

<div id="feedback"></div>
<div id="error"></div>

<button onclick="nextQuestion()" id="next-btn">Next Question →</button>
</div>

<script>
const questions = [
{q:"What is the form of government of the United States?",a:["republic","constitution-based federal republic","representative democracy"]},
{q:"What is the supreme law of the land?",a:["the constitution","u.s. constitution"]},
{q:"Name one thing the U.S. Constitution does.",a:["forms the government","defines powers of government","protects the rights of the people"]},
{q:"The U.S. Constitution starts with the words “We the People.” What does “We the People” mean?",a:["self-government","popular sovereignty","consent of the governed"]},
{q:"How are changes made to the U.S. Constitution?",a:["amendments","the amendment process"]},
{q:"What does the Bill of Rights protect?",a:["rights of americans","basic rights"]},
{q:"How many amendments does the Constitution have?",a:["27","twenty seven"]},
{q:"Why is the Declaration of Independence important?",a:["america is free","all people are created equal","inherent rights"]},
{q:"What founding document said the colonies were free from Britain?",a:["declaration of independence"]},
{q:"What are important ideas from the Declaration of Independence and the Constitution?",a:["equality","liberty","natural rights","self government"]},
{q:"The words “Life, Liberty, and the pursuit of Happiness” are in what founding document?",a:["declaration of independence"]},
{q:"What is the economic system of the United States?",a:["capitalism","free market economy"]},
{q:"What is the rule of law?",a:["everyone must follow the law","no one is above the law"]},
{q:"Why are there three branches of government?",a:["checks and balances","separation of powers"]},
{q:"Name the three branches of government.",a:["legislative executive and judicial","congress president and courts"]},
{q:"What part of the federal government writes laws?",a:["congress","legislative branch"]},
{q:"What are the two parts of Congress?",a:["senate and house"]},
{q:"How many U.S. senators are there?",a:["100","one hundred"]},
{q:"How long is a term for a U.S. senator?",a:["six years"]},
{q:"How many voting members are in the House of Representatives?",a:["435","four hundred thirty five"]},
{q:"How long is a term for a member of the House?",a:["two years"]},
{q:"How many senators does each state have?",a:["two"]},
{q:"Who is the President of the United States now?",a:["donald trump","donald j trump"]},
{q:"Who is the Vice President now?",a:["jd vance","james david vance"]},
{q:"If the president can no longer serve, who becomes president?",a:["vice president"]},
{q:"Who is Commander in Chief of the military?",a:["the president"]},
{q:"Who signs bills into law?",a:["the president"]},
{q:"Who vetoes bills?",a:["the president"]},
{q:"Who appoints federal judges?",a:["the president"]},
{q:"What does the President’s Cabinet do?",a:["advises the president"]},
{q:"Who is the governor of Connecticut?",a:["ned lamont"]},
{q:"What is the capital of Connecticut?",a:["hartford"]},
{q:"Who is the Chief Justice of the United States?",a:["john roberts"]},
{q:"How many justices are on the Supreme Court?",a:["9","nine"]},
{q:"What is the capital of the United States?",a:["washington dc"]},
{q:"Why does the flag have 13 stripes?",a:["13 original colonies"]},
{q:"Why does the flag have 50 stars?",a:["50 states"]},
{q:"What is the name of the national anthem?",a:["the star spangled banner"]},
{q:"When is Independence Day?",a:["july 4","fourth of july"]},
{q:"What is Memorial Day?",a:["honors soldiers who died"]},
{q:"What is Veterans Day?",a:["honors all who served"]}
];

// Shuffle questions
questions.sort(() => Math.random() - 0.5);

let index = 0;

function displayQuestion() {
    document.getElementById("question").innerText =
        (index + 1) + ". " + questions[index].q;
    document.getElementById("feedback").innerHTML = "";
    document.getElementById("error").innerText = "";
    document.getElementById("next-btn").style.display = "none";
}

function speakQuestion() {
    const u = new SpeechSynthesisUtterance(questions[index].q);
    u.lang = "en-US";
    u.rate = 0.95;
    speechSynthesis.speak(u);
}

function startListening() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        document.getElementById("error").innerText = "Use Chrome or Edge.";
        return;
    }
    const recognition = new SpeechRecognition();
    recognition.lang = "en-US";
    recognition.start();

    recognition.onresult = e => {
        const spoken = e.results[0][0].transcript.toLowerCase();
        checkAnswer(spoken);
    };
}

function checkAnswer(userAnswer) {
    const correct = questions[index].a;
    const ok = correct.some(a => userAnswer.includes(a));

    document.getElementById("feedback").innerHTML =
        ok
        ? `<span id="correct">Correct!</span><br>You said: "${userAnswer}"`
        : `<span id="incorrect">Incorrect.</span><br>You said: "${userAnswer}"<br>Correct answers: ${correct.join(", ")}`;

    document.getElementById("next-btn").style.display = "inline-block";
}

function nextQuestion() {
    index++;
    if (index < questions.length) {
        displayQuestion();
        speakQuestion();
    } else {
        document.getElementById("question").innerText =
            "🎉 Congratulations Miriam! You finished the practice.";
        document.getElementById("feedback").innerText =
            "You are ready for your USCIS interview 🇺🇸";
        document.querySelectorAll("button").forEach(b => b.style.display="none");
    }
}

displayQuestion();
speakQuestion();
</script>
</body>
</html>
