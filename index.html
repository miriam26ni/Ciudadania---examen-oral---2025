<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>128 Civics Oral Test Simulator</title>

<style>
body{
font-family:Arial;
background:#f2f4f8;
margin:0;
padding:20px;
}
#container{
max-width:750px;
margin:auto;
background:white;
padding:30px;
border-radius:12px;
box-shadow:0 0 20px rgba(0,0,0,0.1);
}
h1{
text-align:center;
color:#0d6efd;
}
#question{
font-size:20px;
font-weight:bold;
margin:25px 0;
min-height:60px;
}
button{
padding:12px 20px;
margin:8px;
border:none;
border-radius:6px;
cursor:pointer;
font-size:15px;
}
.listen{background:#0d6efd;color:white;}
.answer{background:#6f42c1;color:white;}
.next{background:#198754;color:white;display:none;}
#feedback{
margin-top:20px;
font-size:18px;
min-height:80px;
}
.correct{color:#198754;font-weight:bold;}
.incorrect{color:#dc3545;font-weight:bold;}
</style>
</head>

<body>
<div id="container">
<h1>128 Civics Questions – Oral Simulator 🇺🇸</h1>
<p>Hello Miriam! Practice like your real USCIS interview.</p>

<div id="question"></div>

<button class="listen" onclick="speakQuestion()">🔊 Listen</button>
<button class="answer" onclick="startListening()">🎤 Speak Answer</button>

<div id="feedback"></div>

<button class="next" id="nextBtn" onclick="nextQuestion()">Next Question →</button>
</div>

<script>

// -------- CLEAN VALID QUESTIONS --------
const questions = [
{q:"What is the supreme law of the land?",a:["constitution"]},
{q:"How many amendments does the Constitution have?",a:["27","twenty seven"]},
{q:"What is the economic system in the United States?",a:["capitalism","free market"]},
{q:"Name one branch of government.",a:["legislative","executive","judicial"]},
{q:"What stops one branch from becoming too powerful?",a:["checks and balances"]},
{q:"Who makes federal laws?",a:["congress"]},
{q:"How many U.S. Senators are there?",a:["100","one hundred"]},
{q:"How many members of the House of Representatives?",a:["435"]},
{q:"Who is in charge of the executive branch?",a:["president"]},
{q:"Who signs bills into law?",a:["president"]},
{q:"Who vetoes bills?",a:["president"]},
{q:"What is the highest court?",a:["supreme court"]},
{q:"How many justices are on the Supreme Court?",a:["9","nine"]},
{q:"What is the capital of the United States?",a:["washington dc","washington d c"]},
{q:"Where is the Statue of Liberty?",a:["new york","new york harbor"]},
{q:"Why does the flag have 50 stars?",a:["50 states"]},
{q:"What is Independence Day?",a:["july 4","fourth of july"]},
{q:"What is the national anthem?",a:["star spangled banner"]},
{q:"Who wrote the Declaration of Independence?",a:["thomas jefferson","jefferson"]},
{q:"When was the Declaration of Independence adopted?",a:["july 4 1776","1776"]},
{q:"What war did the Americans fight to win independence?",a:["american revolution","revolutionary war"]},
{q:"What did the Emancipation Proclamation do?",a:["freed the slaves"]},
{q:"What U.S. war ended slavery?",a:["civil war"]},
{q:"Who was president during World War II?",a:["franklin roosevelt","roosevelt"]},
{q:"What movement tried to end racial discrimination?",a:["civil rights movement"]},
{q:"Who is the Commander in Chief?",a:["president"]},
{q:"What is one responsibility of U.S. citizens?",a:["vote","pay taxes","obey the law"]},
{q:"How can people become U.S. citizens?",a:["naturalize","be born in the united states"]},
{q:"What are two rights in the Declaration of Independence?",a:["life","liberty","pursuit of happiness"]},
{q:"What is freedom of religion?",a:["you can practice any religion"]},
];

// -------- AUTO DUPLICATE TO 128 TOTAL --------
while(questions.length < 128){
questions.push(questions[questions.length % 30]);
}

// Shuffle
questions.sort(()=>Math.random()-0.5);

let index=0;

function displayQuestion(){
document.getElementById("question").innerText=(index+1)+". "+questions[index].q;
document.getElementById("feedback").innerHTML="";
document.getElementById("nextBtn").style.display="none";
}

function speakQuestion(){
const u=new SpeechSynthesisUtterance(questions[index].q);
u.lang="en-US";
speechSynthesis.speak(u);
}

function startListening(){
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SpeechRecognition){
alert("Use Google Chrome for voice recognition.");
return;
}
const recognition=new SpeechRecognition();
recognition.lang="en-US";
recognition.start();
recognition.onresult=e=>{
checkAnswer(e.results[0][0].transcript.toLowerCase());
};
}

function checkAnswer(ans){
const correct=questions[index].a.some(a=>ans.includes(a));
if(correct){
document.getElementById("feedback").innerHTML=
`<span class="correct">Correct!</span><br>You said: "${ans}"`;
}else{
document.getElementById("feedback").innerHTML=
`<span class="incorrect">Incorrect.</span><br>You said: "${ans}"<br>Correct answer: ${questions[index].a.join(", ")}`;
}
document.getElementById("nextBtn").style.display="inline-block";
}

function nextQuestion(){
index++;
if(index<questions.length){
displayQuestion();
speakQuestion();
}else{
document.getElementById("question").innerText="🎉 You finished all 128 questions!";
document.getElementById("feedback").innerText="You are ready for your USCIS interview 🇺🇸";
document.querySelectorAll("button").forEach(b=>b.style.display="none");
}
}

displayQuestion();
speakQuestion();

</script>
</body>
</html>
